      /* Everything in a layer: StyleX emits layered CSS and unlayered rules
         would beat it regardless of specificity. `reset` is declared first so
         it sits under every StyleX layer. */
      @layer reset;
      @layer reset {
        /* iOS shows no persistent scrollbar; an app that wants one styles its own over this. */
        * { margin: 0; box-sizing: border-box; scrollbar-width: none; }
        ::-webkit-scrollbar { display: none; }
        button, input, textarea { font: inherit; color: inherit; }
        button { border: 0; background: none; cursor: pointer; }
        img { -webkit-user-drag: none; }
        iframe { border: 0; width: 100%; height: 100%; background: #fff; display: block; }
        video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
        /* Page-level: the elements React never renders. Everything else is StyleX. */
        html, body { height: 100%; overflow: hidden; background: transparent; }
        body {
          font: 400 17px/22px -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", sans-serif;
          letter-spacing: -0.43px;
          color: #1d1d1f;
          -webkit-user-select: none; user-select: none;
        }
        /* In a browser the page is the backdrop; on the desktop the wallpaper is. */
        html.web body { background: #f6f6f3; }
      }
