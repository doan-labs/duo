# duo.doan-labs.com as a static site: `docker compose -p duo-static up -d` beside a
# `site/` folder holding packages/web/dist/client. Its own project and network; it
# publishes no host port, the Cloudflare Tunnel connector reaches it on this network.
name: duo-static

services:
  web:
    image: caddy:2.10.2-alpine
    container_name: duo-static-web
    restart: unless-stopped
    user: '65534:65534'
    read_only: true
    cap_drop: [ALL]
    # The image's caddy binary carries the file capability cap_net_bind_service;
    # exec fails unless it stays in the bounding set, even though :8080 needs none.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    mem_limit: 128m
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
    environment:
      XDG_CONFIG_HOME: /tmp
      XDG_DATA_HOME: /tmp
    tmpfs: [/tmp]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
