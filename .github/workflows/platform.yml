name: Developer platform
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  platform:
    # Fork PRs run untrusted code: keep them off the self-hosted runner.
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || '["self-hosted","custom-ci"]') }}
    timeout-minutes: 15
    env:
      # Bun's FTL optimizer miscompiles StyleX's media-query parser: oven-sh/bun#41609.
      BUN_JSC_useFTLJIT: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun scripts/check-platform.ts
