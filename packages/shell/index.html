<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iPhone Duo</title>
    <link rel="icon" href="../../public/icon.svg" type="image/svg+xml" />
    <!-- The body of the phone, fetched by main.ts. Asked for here so it downloads
         while the module graph is still being parsed rather than after it. -->
    <link rel="preload" href="/model/iPhone_Duo_Render.usdc" as="fetch" crossorigin />
    <style>
      /* Everything in a layer: StyleX emits layered CSS and unlayered rules
         would beat it regardless of specificity. `reset` is declared first so
         it sits under every StyleX layer. */
      @layer reset;
      @layer reset {
        /* iOS shows no persistent scrollbar; an app that wants one styles its own over this. */
        * { margin: 0; box-sizing: border-box; scrollbar-width: none; }
        ::-webkit-scrollbar { display: none; }
        button, input, textarea { font: inherit; color: inherit; }
        button { border: 0; background: none; cursor: pointer; }
        img { -webkit-user-drag: none; }
        iframe { border: 0; width: 100%; height: 100%; background: #fff; display: block; }
        video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
        /* Page-level: the elements React never renders. Everything else is StyleX. */
        html, body { height: 100%; overflow: hidden; background: transparent; }
        body {
          font: 400 17px/22px -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", sans-serif;
          letter-spacing: -0.43px;
          color: #1d1d1f;
          -webkit-user-select: none; user-select: none;
        }
        /* In a browser the page is the backdrop; on the desktop the wallpaper is. */
        html.web body { background: #f6f6f3; }
        /* The model takes a few seconds to arrive; the scene fades in on its
           first frame rather than popping (main.ts writes `data-ready`). The
           rule targets only the scene canvas appended to body: canvases apps
           draw inside the screens must keep their own positioning. */
        body > canvas { position: fixed; inset: 0; cursor: grab; opacity: 0; transition: opacity 0.45s ease; }
        body[data-ready] > canvas { opacity: 1; }
        body > canvas:active { cursor: grabbing; }
        @media (prefers-reduced-motion: reduce) { body > canvas { transition: none; } }
      }
    </style>
  </head>
  <body>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
