<!doctype html><html><head><meta charset="utf-8">
<!-- The /kit social card, 1200 × 630. Serve packages/web/public (python3 -m http.server) with this file
     copied in, open it at a 1200 × 630 viewport with agent-browser, screenshot to public/og/platform.png. -->
<title>Platform card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Inter+Tight:wght@500..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0a0a0b}
.card{position:relative;width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif;color:#f4efe4;
 background:radial-gradient(640px 420px at 78% 38%,rgba(122,122,230,.26),transparent 70%),radial-gradient(520px 380px at 8% 100%,rgba(255,159,64,.10),transparent 70%),#0a0a0b}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(122,122,230,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(122,122,230,.07) 1px,transparent 1px);background-size:30px 30px;mask-image:radial-gradient(700px 500px at 75% 45%,#000 30%,transparent 80%)}
.brand{position:absolute;left:72px;top:56px;display:flex;align-items:center;gap:14px;font:600 22px Inter}
.brand img{width:36px;height:36px}
.url{position:absolute;right:72px;top:64px;font:400 16px 'Geist Mono';color:#9a9aa3}
.left{position:absolute;left:72px;top:148px;width:480px}
.cap{font:500 14px 'Geist Mono';letter-spacing:.12em;color:#8b8bf0;text-transform:uppercase}
h1{margin-top:18px;font:700 80px/0.95 'Inter Tight';letter-spacing:-.045em}
p{margin-top:24px;font:400 21px/1.4 Inter;color:#a8a8b0}
.pills{margin-top:32px;display:flex;gap:6px}
.pill{padding:5px 10px;border-radius:999px;font:500 12px 'Geist Mono';border:1px solid #2c2c33;color:#b8b8c0;background:rgba(255,255,255,.02)}
.pill.app{border-color:#ff9f40;color:#ffb66b}
.pill.kit{border-color:#5d5dc9;color:#a3a3f5}
.foot{position:absolute;left:72px;bottom:44px;display:flex;align-items:center;gap:10px;font:400 16px Inter;color:#9a9aa3}
.stack{position:absolute;left:585px;top:40px;width:1193px;height:1274px;transform:scale(.53);transform-origin:0 0}
.stack img{position:absolute;left:0;width:1193px;height:524px}
</style></head><body><div class="card">
<div class="grid"></div>
<div class="brand"><img src="/icon.svg">Duo</div>
<div class="url">duo.doan-labs.com/kit</div>
<div class="left">
 <div class="cap">Platform</div>
 <h1>Duo,<br>taken apart.</h1>
 <p>Six layers, from the window it runs in<br>to a stranger's app.</p>
 <div class="pills"><span class="pill">Window</span><span class="pill">Shell</span><span class="pill">OS × 2</span><span class="pill">Runtime</span><span class="pill app">App</span><span class="pill kit">SDK + kit</span></div>
</div>
<div class="foot"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M5.6 3.4A4.1 4.1 0 0 1 5.6 11.6Z"/><path d="M21 7.5A4.5 4.5 0 1 1 12 7.5A4.5 4.5 0 1 1 21 7.5ZM19.2 7.5A2.7 2.7 0 1 0 13.8 7.5A2.7 2.7 0 1 0 19.2 7.5Z"/><path d="M7.5 12.9L3.5 20.1L11.5 20.1Z"/><path d="M16.5 11.586L21.414 16.5L16.5 21.414L11.586 16.5ZM16.5 14.061L14.061 16.5L16.5 18.939L18.939 16.5Z"/></svg>An experiment by Doan Labs</div>
<div class="stack" id="s"></div>
</div>
<script>
const F=['window','shell','os','runtime','app','sdk'],LIFT=118,BASE=5*LIFT
F.forEach((f,i)=>{const im=new Image();im.src="/platform/"+f+".webp";im.style.top=(BASE-i*LIFT)+'px';document.getElementById('s').appendChild(im)})
</script></body></html>
