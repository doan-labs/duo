[package]
name = "iphoneduo"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "iphoneduo"
path = "main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
